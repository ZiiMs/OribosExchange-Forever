# Refreshes the addon's Forever price data from Undermine Exchange.
# The Railway cron dispatcher requests a refresh every three hours, away from
# GitHub's minute-zero peak. GitHub's own schedule trigger is intentionally
# absent: it fired late (or not at all) and duplicated Railway's slots.
name: Refresh Forever data
run-name: Forever prices (${{ inputs.trigger_source }})

on:
  # Railway only. See tools/railway-dispatch/README.md for the dispatcher.
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Who requested this refresh
        type: choice
        options:
          - manual
          - railway
        default: manual

permissions:
  contents: write

concurrency:
  group: refresh-forever-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate refresh configuration
        run: node --test tools/forever-data/*.test.js tools/railway-dispatch/*.test.js

      - name: Build Forever data
        run: node tools/forever-data/build.js

      - name: Commit data and bump version
        id: data
        run: |
          if git diff --quiet -- OribosExchange/dynamic; then
            echo "No price changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="1.3.20261106-forever2.$(date -u +%Y%m%d%H%M%S)"
          sed -i "s/^## Version:.*/## Version: $VERSION/" OribosExchange/OribosExchange.toc

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OribosExchange/dynamic/data.*.lua OribosExchange/OribosExchange.toc
          git commit -m "Refresh Forever price data ($VERSION)"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package addon
        if: steps.data.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.data.outputs.version }}"
          mkdir -p dist
          git archive --format=zip --prefix=OribosExchange/ -o "dist/OribosExchange-$VERSION.zip" HEAD:OribosExchange

      - name: Create release
        if: steps.data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.data.outputs.version }}"
          gh release create "v$VERSION" "dist/OribosExchange-$VERSION.zip" \
            --target "$(git rev-parse HEAD)" \
            --title "Oribos Exchange $VERSION" \
            --notes "Automatic Forever price data refresh ($VERSION UTC). Prices from Undermine Exchange." \
            --latest

      - name: Refresh summary
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          CHANGED: ${{ steps.data.outputs.changed }}
          VERSION: ${{ steps.data.outputs.version }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Forever price refresh'
            echo "- GitHub event: $TRIGGER"
            echo "- Dispatch source: ${TRIGGER_SOURCE:-manual}"
            echo '- A Railway-labelled dispatch verifies the connection; Railway cron logs verify unattended scheduling.'
            echo "- Finished: $(date -u +%FT%TZ)"
            echo '- Scheduler: Railway cron, every three hours at :37 UTC'
            echo "- Job: $JOB_STATUS"
            echo "- Data changed: ${CHANGED:-not determined}"
            echo "- Release version: ${VERSION:-none}"
            echo '### Per-region source timestamps'
            grep -H '^-- Data as of ' OribosExchange/dynamic/data.*.lua || true
          } >> "$GITHUB_STEP_SUMMARY"
