# Refreshes the addon's Forever price data from Undermine Exchange.
# GitHub's scheduler is best-effort, so this runs hourly and refreshes when
# the last scheduled success is older than ~3 hours. Stale queued runs are
# cancelled by newer ones.
name: Refresh Forever data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: refresh-forever-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Check last scheduled refresh
        id: age
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/refresh-data.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].run_started_at // empty')
          if [ -z "$LAST" ]; then
            echo "No previous scheduled run."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_EPOCH=$(date -d "$LAST" +%s)
          NOW=$(date +%s)
          AGE_MIN=$(( (NOW - LAST_EPOCH) / 60 ))
          echo "Last scheduled success: $LAST ($AGE_MIN minutes ago)"
          if [ "$AGE_MIN" -lt 170 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Forever data
        if: github.event_name == 'workflow_dispatch' || steps.age.outputs.skip != 'true'
        run: node tools/forever-data/build.js

      - name: Commit data and bump version
        if: github.event_name == 'workflow_dispatch' || steps.age.outputs.skip != 'true'
        id: data
        run: |
          if git diff --quiet -- OribosExchange/dynamic; then
            echo "No price changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="1.3.20261106-forever2.$(date -u +%Y%m%d%H%M%S)"
          sed -i "s/^## Version:.*/## Version: $VERSION/" OribosExchange/OribosExchange.toc

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OribosExchange/dynamic/data.*.lua OribosExchange/OribosExchange.toc
          git commit -m "Refresh Forever price data ($VERSION)"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package addon
        if: steps.data.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.data.outputs.version }}"
          mkdir -p dist
          git archive --format=zip --prefix=OribosExchange/ -o "dist/OribosExchange-$VERSION.zip" HEAD:OribosExchange

      - name: Create release
        if: steps.data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.data.outputs.version }}"
          gh release create "v$VERSION" "dist/OribosExchange-$VERSION.zip" \
            --title "Oribos Exchange $VERSION" \
            --notes "Automatic Forever price data refresh ($VERSION UTC). Prices from Undermine Exchange." \
            --latest
